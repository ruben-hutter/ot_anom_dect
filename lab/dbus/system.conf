<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
          "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Why this file exists: the stock dbus configs only listen on unix
       sockets and authenticate via kernel credentials — neither exists
       across containers. This makes the bus listen on TCP and accept
       connections without credentials (fine for a hello-world lab). -->
  <listen>tcp:host=0.0.0.0,bind=*,port=55556,family=ipv4</listen>

  <auth>ANONYMOUS</auth>
  <allow_anonymous/>
  <auth>DBUS_COOKIE_SHA1</auth>

  <!-- "allow everything", same as the stock session-bus policy; the
       eavesdrop flag makes error replies and monitors work -->
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
    <allow user="*"/>
  </policy>
</busconfig>
