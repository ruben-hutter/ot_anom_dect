name: ot-anom

# Pinned subnet so the lab doesn't collide with other docker networks on this
# host (the containerlab default 172.20.20.0/24 overlapped one).
mgmt:
  network: ot-anom-mgmt
  ipv4-subnet: 172.27.100.0/24
  ipv6-subnet: 3fff:172:27:100::/64

topology:
  nodes:
    # runs the Modbus TCP slave/simulator, listening on :502 and holding the
    # register map (coils/discrete inputs/holding/input registers)
    modbus-server:
      kind: linux
      image: debian:bookworm-slim
      binds:
        - ./modbus:/opt/modbus:ro

    # a Modbus TCP master that polls and writes registers over the network
    modbus-master:
      kind: linux
      image: debian:bookworm-slim
      binds:
        - ./modbus:/opt/modbus:ro
